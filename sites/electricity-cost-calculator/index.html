<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electricity Cost Calculator — Know Your Energy Bills</title>
  <meta name="description" content="Calculate electricity costs per appliance. Find out how much each device costs to run monthly and yearly. Save money on energy bills!">
  <link rel="stylesheet" href="shared-styles.css"><link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container container-sm">
    <section class="hero"><h1>⚡ <span class="text-gradient">Electricity Cost</span></h1><p>Know exactly how much each appliance costs you</p></section>
    <div class="card glass">
      <div class="flex gap-3 mb-4">
        <div class="flex-1"><label class="label">Rate (per kWh)</label><div class="flex gap-2"><select id="currency" class="input" style="width:70px"><option>$</option><option>€</option><option>£</option><option>₹</option></select><input type="number" id="rate" class="input flex-1" value="0.12" step="0.01" oninput="recalcAll()"></div></div>
      </div>
      <h4 class="mb-2">Your Appliances</h4>
      <div id="appliance-list"></div>
      <button class="btn btn-secondary w-full mt-3" onclick="addAppliance()">+ Add Appliance</button>
      <div class="presets mt-4"><p class="label">Quick Add:</p><div class="flex flex-wrap gap-2" id="presets"></div></div>
    </div>
    <div class="card mt-4" id="summary-card" style="display:none">
      <h3>💰 Cost Summary</h3>
      <div id="summary"></div>
      <div class="total-bar mt-4" id="total-bar"></div>
    </div>
  </div>
  <footer class="footer"><p>&copy; 2026 Electricity Cost Calculator.</p></footer>
  <script src="app.js"></script>
</body>
</html>
