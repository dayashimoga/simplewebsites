<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mock Data Generator (JSON / CSV)</title>
  <meta name="description" content="Generate realistic mock data instantly for testing and development. Output as JSON or CSV completely offline.">
  <link rel="stylesheet" href="shared-styles.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container container-lg">
    <section class="hero text-center mb-6">
      <h1>🗄️ <span class="text-gradient">Mock Data Generator</span></h1>
      <p>Generate thousands of rows of realistic test data in seconds</p>
    </section>

    <div class="layout-grid">
      <!-- Editor -->
      <div class="card p-4 d-flex flex-column h-full">
        <h3 class="mb-4">Data Schema</h3>
        
        <div id="schema-fields" class="space-y-3 mb-4 flex-1 overflow-y-auto pr-2" style="max-height: 400px;">
          <!-- Fields go here -->
        </div>
        
        <button class="btn btn-secondary w-full mb-4" onclick="addField()">+ Add Field</button>
        
        <div class="grid col-2 gap-4 border-t border-border pt-4">
          <div class="form-group">
            <label class="form-label font-bold text-sm">Number of Rows</label>
            <input type="number" id="num-rows" class="input w-full p-2" min="1" max="5000" value="10">
          </div>
          <div class="form-group">
            <label class="form-label font-bold text-sm">Output Format</label>
            <select id="output-format" class="input w-full p-2 font-bold" onchange="generateData()">
              <option value="json">JSON</option>
              <option value="csv">CSV</option>
            </select>
          </div>
        </div>
        
        <button class="btn btn-primary w-full py-3 mt-4 text-lg font-bold" onclick="generateData()">
          ⚙️ Generate Data
        </button>
      </div>

      <!-- Result -->
      <div class="card bg-surface p-4 d-flex flex-column h-full">
        <div class="d-flex justify-between align-center mb-3">
          <h3 class="m-0">Preview</h3>
          <button class="btn btn-sm btn-primary" onclick="downloadData()">Download File</button>
        </div>
        
        <textarea id="output-result" class="input w-full p-4 font-mono text-sm flex-1 min-h-64 resize-none bg-bg" readonly placeholder="Your generated data will appear here..."></textarea>
        
        <div class="text-right mt-3">
          <button class="btn btn-secondary" onclick="copyResult()">📋 Copy to Clipboard</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer text-center mt-6">
    <p>&copy; 2026 Mock Data Generator. 100% Client-side.</p>
  </footer>
  
  <script src="app.js"></script>
  <script src="shared-theme-toggle.js"></script>
</body>
</html>
