<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin Dashboard</title>
    <meta name="description" content="Manage all deployed toolkit websites.">
    <link rel="stylesheet" href="shared-styles.css">
    <style>
        .grid-sites { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--space-4); margin-top: var(--space-6); }
        .site-card { display: flex; align-items: center; justify-content: space-between; padding: var(--space-4);   transition: all 0.3s ease; }
        .site-card:hover { border-color: var(--color-primary);  }
        .site-card.disabled { opacity: 0.6; filter: grayscale(100%); }
        .site-info { display: flex; align-items: center; gap: var(--space-3); }
        .site-emoji { font-size: 1.5rem; }
        .site-title { font-weight: bold; }
        .toggle-btn { padding: 4px 12px;  font-weight: 500; cursor: pointer; transition: all 0.2s ease; border: none; }
        .toggle-btn.enabled { background: #22c55e; color: white; }
        .toggle-btn.disabled { background: #ef4444; color: white; }
        
        #auth-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 50; }
        .auth-card { background: var(--color-surface); padding: var(--space-6);   width: 100%; max-width: 400px; text-align: center; }
        
        .stats-header { display: flex; justify-content: space-between; align-items: center; padding: var(--space-4); }
        .stats-row { display: flex; gap: var(--space-6); }
        .stat-box { display: flex; flex-direction: column; align-items: center; }
        .stat-num { font-size: 1.6rem; font-weight: 900; }
        .stat-lbl { font-size: 0.7rem; color: var(--color-text-secondary, #888); text-transform: uppercase; letter-spacing: 1px; }
        .text-green { color: #22c55e; }
        .text-red { color: #ef4444; }
        
        .toolbar { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3); }
        .search-box { flex: 1; padding: 8px 14px; background: rgba(255,255,255,0.05); border: 1px solid var(--color-border, rgba(255,255,255,0.1)); border-radius: 8px; color: inherit; font-size: 0.9rem; }
        .search-box:focus { outline: none; border-color: var(--color-primary, #3b82f6); }
        .toolbar-actions { display: flex; gap: 6px; }
    </style>
</head>
<body>
    <div id="auth-modal">
        <div class="auth-card glass">
            <h2 class="mb-4">🛡️ Admin Login</h2>
            <p class="mb-4 text-sm opacity-80">Enter your master passkey to manage websites.</p>
            <form id="auth-form" class="flex flex-col gap-4">
                <input type="password" id="passkey-input" class="input-text w-full" placeholder="Enter Passkey..." required>
                <button type="submit" class="btn btn-primary w-full">Authenticate</button>
            </form>
            <div id="auth-error" class="hidden text-red-500 mt-2 text-sm"></div>
        </div>
    </div>

    <div class="container animate-fadeIn" id="main-content" style="display:none; padding-bottom: 4rem;">
        <section class="hero text-center mb-8">
            <h1>🛡️ <span class="text-gradient">Site Management</span></h1>
            <p>Toggle any tool online or offline instantly via Cloudflare KV.</p>
        </section>

        <div class="card glass stats-header mb-4">
            <div class="stats-row">
                <div class="stat-box"><span class="stat-num" id="site-count">0</span><span class="stat-lbl">Total</span></div>
                <div class="stat-box"><span class="stat-num text-green" id="online-count">0</span><span class="stat-lbl">Online</span></div>
                <div class="stat-box"><span class="stat-num text-red" id="offline-count">0</span><span class="stat-lbl">Offline</span></div>
            </div>
            <button class="btn btn-secondary text-sm" onclick="logout()">🔒 Logout</button>
        </div>

        <div class="card glass toolbar mb-4">
            <input type="text" id="search-input" class="input-text search-box" placeholder="🔍 Search sites..." oninput="filterSites()">
            <div class="toolbar-actions">
                <button class="btn btn-sm btn-primary" onclick="bulkToggle(true)">✅ Enable All</button>
                <button class="btn btn-sm btn-secondary" onclick="bulkToggle(false)">⛔ Disable All</button>
            </div>
        </div>

        <div id="loading" class="text-center animate-pulse text-accent py-8">Fetching platform KV status...</div>
        
        <div id="sites-grid" class="grid-sites">
            <!-- Dynamic Cards -->
        </div>
    </div>

    <script src="app.js"></script>
    <script src="shared-theme-toggle.js"></script>
</body>
</html>
