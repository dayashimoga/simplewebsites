<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text to Handwriting Converter</title>
  <meta name="description" content="Convert typed text into realistic handwriting. Choose fonts, ink color, and paper style to generate custom handwritten notes.">
  <link rel="stylesheet" href="shared-styles.css">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Indie+Flower&family=Shadows+Into+Light&family=Permanent+Marker&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <section class="hero text-center mb-6">
      <h1>✍️ <span class="text-gradient">Text to Handwriting</span></h1>
      <p>Instantly convert your digital text into realistic handwritten notes</p>
    </section>

    <div class="layout-grid">
      <!-- Controls -->
      <div class="card controls-section">
        <div class="form-group mb-4">
          <label for="input-text" class="form-label font-bold">Your Text</label>
          <textarea id="input-text" class="input w-full p-3 h-32" placeholder="Start typing here to see it convert to handwriting..." oninput="drawHandwriting()"></textarea>
        </div>
        
        <div class="grid col-2 gap-3 mb-4">
          <div class="form-group">
            <label for="font-family" class="form-label text-sm">Handwriting Font</label>
            <select id="font-family" class="input w-full p-2" onchange="drawHandwriting()">
              <option value="'Caveat', cursive">Caveat</option>
              <option value="'Indie Flower', cursive">Indie Flower</option>
              <option value="'Shadows Into Light', cursive">Shadows Into Light</option>
              <option value="'Permanent Marker', cursive">Permanent Marker</option>
            </select>
          </div>
          <div class="form-group">
            <label for="paper-style" class="form-label text-sm">Paper Style</label>
            <select id="paper-style" class="input w-full p-2" onchange="drawHandwriting()">
              <option value="lined">Lined Paper</option>
              <option value="blank">Blank White</option>
              <option value="yellow">Yellow LegalPad</option>
            </select>
          </div>
        </div>

        <div class="grid col-2 gap-3 mb-4">
          <div class="form-group">
            <label for="font-size" class="form-label text-sm">Font Size: <span id="font-size-val">24</span>px</label>
            <input type="range" id="font-size" min="14" max="60" value="24" class="w-full" oninput="drawHandwriting(true)">
          </div>
          <div class="form-group">
            <label for="ink-color" class="form-label text-sm">Ink Color</label>
            <select id="ink-color" class="input w-full p-2" onchange="drawHandwriting()">
              <option value="#000080">Blue Pen</option>
              <option value="#000000">Black Pen</option>
              <option value="#cc0000">Red Pen</option>
              <option value="#34a853">Green Pen</option>
            </select>
          </div>
        </div>

        <button class="btn btn-primary w-full py-3 mt-4 font-bold text-lg" onclick="downloadImage()">
          📥 Download Image
        </button>
      </div>

      <!-- Preview -->
      <div class="card preview-section d-flex justify-center bg-surface relative overflow-hidden">
        <div class="canvas-wrapper">
          <canvas id="handwriting-canvas" width="600" height="800" class="shadow-md rounded block"></canvas>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer text-center mt-6">
    <p>&copy; 2026 Text to Handwriting. Transform your text.</p>
  </footer>
  
  <script src="app.js"></script>
  <script src="shared-theme-toggle.js"></script>
</body>
</html>
