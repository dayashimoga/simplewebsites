<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Grocery List</title><meta name="description" content="Smart grocery list with categories"><link rel="stylesheet" href="shared-styles.css"><link rel="stylesheet" href="style.css"></head><body><div class="container container-sm"><section class="hero"><h1>🛒 <span class="text-gradient">Grocery List</span></h1></section><div class="card glass"><div class="flex gap-3 mb-4"><input type="text" id="item-input" class="input flex-1" placeholder="Add item..."><select id="cat-select" class="input" style="width:120px"><option>🥬 Produce</option><option>🥛 Dairy</option><option>🥩 Meat</option><option>🍞 Bakery</option><option>🥫 Pantry</option><option>🧊 Frozen</option><option>🧴 Other</option></select><button class="btn btn-primary" onclick="addItem()">Add</button></div><div id="list"></div><div class="flex gap-3 mt-4"><button class="btn btn-secondary flex-1" onclick="clearDone()">Clear Checked</button><button class="btn btn-secondary flex-1" onclick="shareList()">📤 Share</button></div></div></div><footer class="footer"><p>&copy; 2026 Grocery List.</p></footer><script src="app.js"></script></body></html>
