<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age & Currency Toolkit — Life Calculator & Universal Converter</title>
  <meta name="description" content="Calculate your exact age with zodiac sign, or convert currencies and units instantly. Two powerful tools in one beautiful interface.">
  <link rel="stylesheet" href="shared-styles.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container container-sm animate-fadeIn">
    <section class="hero text-center mb-6">
      <h1>🔢 <span class="text-gradient">Age & Currency Toolkit</span></h1>
      <p>Your personal life calculator and universal converter</p>
    </section>

    <!-- Tool Tabs -->
    <div class="tool-tabs mb-6">
      <button class="btn btn-primary active" id="tool-tab-age" onclick="switchToolTab('age')">🎂 Age Calculator</button>
      <button class="btn btn-secondary" id="tool-tab-converter" onclick="switchToolTab('converter')">💱 Converter</button>
    </div>

    <!-- Age Calculator Panel -->
    <div id="tool-panel-age">
      <div class="card glass">
        <label class="form-label font-bold" for="bday">Your Birthday</label>
        <input type="date" id="bday" class="input w-full" onchange="calcAge()">
        <div id="age-result" class="mt-4"></div>
      </div>
    </div>

    <!-- Converter Panel -->
    <div id="tool-panel-converter" class="hidden">
      <div class="card glass">
        <div class="d-flex justify-center gap-2 mb-5 tabs">
          <button class="btn btn-secondary flex-1 active" id="tab-currency" onclick="switchCategory('currency')">💵 Currency</button>
          <button class="btn btn-secondary flex-1" id="tab-length" onclick="switchCategory('length')">📏 Length</button>
          <button class="btn btn-secondary flex-1" id="tab-mass" onclick="switchCategory('mass')">⚖️ Mass</button>
          <button class="btn btn-secondary flex-1" id="tab-temp" onclick="switchCategory('temp')">🌡️ Temp</button>
        </div>
        <div class="converter-box p-4 bg-surface rounded mb-4">
          <div class="grid col-2 gap-4 align-end mb-4">
            <div class="form-group">
              <label class="form-label text-sm font-bold">From</label>
              <input type="number" id="input-from" class="input w-full p-3 font-mono text-lg" value="1" oninput="convert('from')">
            </div>
            <div class="form-group">
              <select id="select-from" class="input w-full p-3 font-bold" onchange="convert('from')"></select>
            </div>
          </div>
          <div class="text-center my-2">
            <button class="btn btn-icon btn-secondary rounded-full" onclick="swapUnits()">🔃</button>
          </div>
          <div class="grid col-2 gap-4 align-end mt-2">
            <div class="form-group">
              <label class="form-label text-sm font-bold">To</label>
              <input type="number" id="input-to" class="input w-full p-3 font-mono text-lg font-bold text-accent" readonly>
            </div>
            <div class="form-group">
              <select id="select-to" class="input w-full p-3 font-bold" onchange="convert('from')"></select>
            </div>
          </div>
        </div>
        <p class="text-center text-sm text-dim m-0" id="status-text">Ready</p>
      </div>
    </div>
  </div>

  <footer class="footer text-center mt-6">
    <p>&copy; 2026 Age & Currency Toolkit.</p>
  </footer>

  <script src="app.js"></script>
  <script src="shared-theme-toggle.js"></script>
</body>
</html>
