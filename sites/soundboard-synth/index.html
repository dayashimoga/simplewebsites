<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soundboard Synth — Free Playable Drum Machine</title>
  <meta name="description" content="Play drums and synth pads in your browser. Record loops, change BPM, and jam online for free.">
  <link rel="stylesheet" href="shared-styles.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container container-md text-center">
    <section class="hero mb-4">
      <h1>🎹 <span class="text-gradient">Soundboard Synth</span></h1>
      <p>Click pads or use your keyboard (A-L) to play. Turn up the volume!</p>
    </section>

    <!-- Controls -->
    <div class="card mb-6 flex-wrap justify-center gap-4 flex shadow-xl border border-gray-800">
      <div class="flex items-center gap-2">
         <span class="text-sm">Waveform:</span>
         <select id="osc-type" class="input p-2 cursor-pointer text-sm" onchange="setOscType(this.value)">
           <option value="sine">Sine (Soft)</option>
           <option value="square">Square (8-bit)</option>
           <option value="sawtooth" selected>Sawtooth (Synth)</option>
           <option value="triangle">Triangle (Mellow)</option>
         </select>
      </div>

      <div class="flex items-center gap-2">
        <span class="text-sm">Volume:</span>
        <input type="range" id="master-vol" class="w-24 accent-accent" min="0" max="1" step="0.05" value="0.5" oninput="setVolume(this.value)">
      </div>
      
      <div class="flex items-center gap-2 border-l border-gray-700 pl-4">
        <button class="btn btn-secondary text-sm" id="btn-record" onclick="toggleRecord()">🔴 Record</button>
        <button class="btn btn-secondary text-sm hidden" id="btn-play" onclick="playLoop()">▶️ Play Loop</button>
        <button class="btn btn-accent text-sm hidden" id="btn-clear" onclick="clearLoop()">🗑️ Clear</button>
      </div>
    </div>

    <!-- The Pads -->
    <div id="pads-grid" class="grid grid-cols-3 sm:grid-cols-4 gap-3 max-w-[600px] mx-auto select-none">
      <!-- Generated by JS -->
    </div>
    
  </div>
  <footer class="footer mt-12"><p>&copy; 2026 Soundboard Synth. Web Audio API powered.</p></footer>
  <script src="app.js"></script><script src="shared-theme-toggle.js"></script>
</body>
</html>
