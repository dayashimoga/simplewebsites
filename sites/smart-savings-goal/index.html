<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Smart Savings Goal</title><meta name="description" content="Track savings with compound interest projections"><link rel="stylesheet" href="shared-styles.css"><link rel="stylesheet" href="style.css"></head><body><div class="container container-sm"><section class="hero"><h1>💰 <span class="text-gradient">Smart Savings Goal</span></h1></section><div class="card glass"><h3>Set Your Goal</h3><div class="grid-2 mt-3"><div><label class="label">Goal Name</label><input type="text" id="goal-name" class="input w-full" value="Emergency Fund"></div><div><label class="label">Target Amount ($)</label><input type="number" id="target" class="input w-full" value="10000"></div><div><label class="label">Monthly Savings ($)</label><input type="number" id="monthly" class="input w-full" value="500"></div><div><label class="label">Current Saved ($)</label><input type="number" id="current" class="input w-full" value="2000"></div><div><label class="label">Annual Interest (%)</label><input type="number" id="interest" class="input w-full" value="5" step="0.1"></div></div><button class="btn btn-primary w-full mt-4" onclick="calculate()">Calculate</button></div><div class="card mt-4" id="result" style="display:none"></div></div><footer class="footer"><p>&copy; 2026 Smart Savings Goal.</p></footer><script src="app.js"></script></body></html>
