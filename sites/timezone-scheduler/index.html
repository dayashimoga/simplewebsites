<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timezone Scheduler & Meeting Planner</title>
  <meta name="description" content="Visual timezone overlap calculator. Find the perfect meeting time across multiple time zones instantly.">
  <link rel="stylesheet" href="shared-styles.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container container-lg">
    <section class="hero text-center mb-6">
      <h1>🌍 <span class="text-gradient">Timezone Scheduler</span></h1>
      <p>Find the exact overlapping hours for remote teams globally</p>
    </section>

    <div class="card mb-6 mb-4">
      <div class="d-flex justify-between align-center mb-3">
        <h3 class="m-0 text-xl font-bold">Timezones</h3>
        <span class="text-dim text-sm" id="current-date-display">...</span>
      </div>
      <div class="d-flex gap-3 align-center mb-4">
        <select id="tz-select" class="input flex-1 p-3">
          <!-- Populated via JS -->
          <option value="">Loading timezones...</option>
        </select>
        <button class="btn btn-primary px-5 py-3" onclick="addTimezone()">+ Add</button>
      </div>

      <div class="timezone-list space-y-3" id="tz-list">
        <!-- Timezone rows injected here -->
      </div>
    </div>
    
    <div class="card bg-surface">
      <h3 class="mb-3 text-lg font-bold">24-Hour Overlap Map</h3>
      <p class="text-dim mb-4 text-sm mt-0"><span class="badge bg-success mr-2"></span> Green = Good overlap (generally 9am to 6pm)</p>
      
      <div class="schedule-grid-wrapper overflow-x-auto">
        <table class="schedule-grid w-full text-center" id="schedule-grid">
          <!-- Grid injected here -->
        </table>
      </div>
    </div>
  </div>

  <footer class="footer text-center mt-6">
    <p>&copy; 2026 Timezone Scheduler.</p>
  </footer>
  
  <script src="app.js"></script>
  <script src="shared-theme-toggle.js"></script>
</body>
</html>
