<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pattern Blast — Memory Pattern Game</title>
  <meta name="description" content="Test your memory with Pattern Blast! Memorize and repeat increasingly complex patterns in this addictive brain-training game with multiple modes.">
  <link rel="stylesheet" href="shared-styles.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container container-sm">
    <section class="hero text-center">
      <h1>🎯 <span class="text-gradient">Pattern Blast</span></h1>
      <p>Memorize the pattern. Repeat it. How far can you go?</p>
    </section>

    <!-- Menu Screen -->
    <div id="menu-screen" class="card">
      <h3 class="text-center mb-4">🎮 Choose Your Mode</h3>
      <div class="mode-grid">
        <button class="mode-card" onclick="startGame('classic')">
          <span class="mode-icon">🧠</span>
          <span class="mode-name">Classic</span>
          <span class="mode-desc">Memorize & repeat the pattern</span>
        </button>
        <button class="mode-card" onclick="startGame('speed')">
          <span class="mode-icon">⚡</span>
          <span class="mode-name">Speed</span>
          <span class="mode-desc">Faster patterns, less time!</span>
        </button>
        <button class="mode-card" onclick="startGame('zen')">
          <span class="mode-icon">🧘</span>
          <span class="mode-name">Zen</span>
          <span class="mode-desc">No timer, just relax & play</span>
        </button>
        <button class="mode-card" onclick="startGame('reverse')">
          <span class="mode-icon">🔄</span>
          <span class="mode-name">Reverse</span>
          <span class="mode-desc">Repeat pattern backwards!</span>
        </button>
      </div>

      <div class="difficulty-section mt-6">
        <h4 class="text-center mb-4">📊 Difficulty</h4>
        <div class="diff-row">
          <button class="diff-btn" data-diff="easy" onclick="setDifficulty('easy')">Easy (3×3)</button>
          <button class="diff-btn active" data-diff="medium" onclick="setDifficulty('medium')">Medium (4×4)</button>
          <button class="diff-btn" data-diff="hard" onclick="setDifficulty('hard')">Hard (5×5)</button>
          <button class="diff-btn" data-diff="extreme" onclick="setDifficulty('extreme')">Extreme (6×6)</button>
        </div>
      </div>

      <div class="mt-6">
        <h4 class="text-center mb-4">🏆 High Scores</h4>
        <div id="high-scores"></div>
      </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" style="display:none">
      <div class="game-hud">
        <div class="hud-item"><span class="hud-label">Score</span><span class="hud-value" id="hud-score">0</span></div>
        <div class="hud-item"><span class="hud-label">Level</span><span class="hud-value" id="hud-level">1</span></div>
        <div class="hud-item"><span class="hud-label">Lives</span><span class="hud-value" id="hud-lives">❤️❤️❤️</span></div>
        <div class="hud-item"><span class="hud-label">Pattern</span><span class="hud-value" id="hud-pattern">0/3</span></div>
        <span class="hud-combo" id="hud-combo" style="display:none">1x</span>
      </div>

      <div class="timer-container">
        <div class="timer-bar" id="timer-bar"></div>
      </div>

      <div class="game-status status-watching" id="game-status">👀 Watch the pattern!</div>

      <div class="game-grid" id="game-grid">
        <!-- Tiles generated by JS -->
      </div>

      <div class="game-controls mt-4">
        <button class="btn btn-secondary" onclick="goMenu()">◀ Menu</button>
        <button class="btn btn-secondary" id="sound-toggle" onclick="toggleSound()">🔊</button>
      </div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="card text-center" style="display:none">
      <div style="font-size:4rem;margin-bottom:8px">🎯</div>
      <h2>Game Over!</h2>
      <div class="rating" id="final-rating">C</div>
      <div class="result-grid mt-6">
        <div class="result-stat">
          <div class="result-value" id="final-score">0</div>
          <div class="result-label">Score</div>
        </div>
        <div class="result-stat">
          <div class="result-value" id="final-level">1</div>
          <div class="result-label">Level</div>
        </div>
        <div class="result-stat">
          <div class="result-value" id="final-combo">0</div>
          <div class="result-label">Best Combo</div>
        </div>
        <div class="result-stat">
          <div class="result-value" id="final-accuracy">0%</div>
          <div class="result-label">Accuracy</div>
        </div>
      </div>
      <div class="mt-6 flex gap-4 justify-center">
        <button class="btn btn-primary" onclick="startGame(currentMode)">🔁 Play Again</button>
        <button class="btn btn-secondary" onclick="goMenu()">◀ Menu</button>
      </div>
    </div>
  </div>

  <footer class="footer"><p>&copy; 2026 Pattern Blast. Train your brain!</p></footer>
  <script src="app.js"></script>
  <script src="shared-theme-toggle.js"></script>
</body>
</html>
