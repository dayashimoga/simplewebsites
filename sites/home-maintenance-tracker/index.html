<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Home Maintenance</title><meta name="description" content="Track home maintenance tasks and schedules"><link rel="stylesheet" href="shared-styles.css"><link rel="stylesheet" href="style.css"></head><body><div class="container container-sm"><section class="hero"><h1>🏠 <span class="text-gradient">Home Maintenance</span></h1></section><div class="card glass"><div class="flex gap-3 mb-4"><input type="text" id="task-input" class="input flex-1" placeholder="Task name..."><select id="freq-select" class="input" style="width:120px"><option value="30">Monthly</option><option value="90" selected>Quarterly</option><option value="180">Semi-Annual</option><option value="365">Yearly</option></select><button class="btn btn-primary" onclick="addTask()">Add</button></div><div class="presets mb-4"><p class="label">Quick Add:</p><div class="flex flex-wrap gap-2" id="presets"></div></div><div id="tasks"></div></div></div><footer class="footer"><p>&copy; 2026 Home Maintenance.</p></footer><script src="app.js"></script></body></html>
