<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Background Remover — Remove Image Backgrounds Instantly</title>
    <meta name="description" content="Use advanced AI to remove backgrounds from your photos instantly, 100% securely in your browser. No server uploads.">
    <link rel="canonical" href="https://stacky.pages.dev/background-remover/">
    <meta property="og:title" content="Free Background Remover"><meta property="og:type" content="website">
    <link rel="stylesheet" href="shared-styles.css"><link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
</head>
<body>
    <div class="ad-container ad-banner" id="ad-top"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="TOP_SLOT"></ins></div>
    <div class="container container-sm">
        <section class="hero"><h1>🪄 <span class="text-gradient">Background Remover</span></h1><p>Remove backgrounds instantly. 100% private — processing happens on your device.</p></section>
        
        <div class="card upload-area mb-8" id="upload-area">
            <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
                <div class="drop-icon">📤</div><p>Upload an image</p><p class="hint">Supports JPG, PNG, WEBP</p>
            </div><input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleUpload(event)">
        </div>

        <div class="results hidden" id="results">
            <div class="card mb-4" id="editor-container" style="display:none; overflow:hidden;">
                <!-- Main image editor view -->
                <div><img id="bg-canvas" class="img-preview checkerboard-bg" style="max-width:100%; display:block;" /></div>
                
                <!-- Toolbar Controls -->
                <div class="mt-4 grid gap-4" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); text-align: left;">
                    <div class="form-group">
                        <label class="label">Background Color</label>
                        <input type="color" id="bg-color" class="input w-full h-10 p-0 cursor-pointer" value="#000000" oninput="updateBgColor()">
                        <p class="hint mt-1" style="font-size:0.75rem">Toggle transparency below to clear</p>
                        <button class="btn btn-secondary w-full" style="padding:0.2rem; font-size:0.7rem; margin-top:5px;" onclick="clearBgColor()">Clear to Transparent</button>
                    </div>
                    
                    <div class="form-group">
                        <label class="label">Rotate Image</label>
                        <div class="flex gap-2">
                            <button class="btn btn-secondary w-full" onclick="rotateImage(-90)">↺ -90°</button>
                            <button class="btn btn-secondary w-full" onclick="rotateImage(90)">↻ 90°</button>
                        </div>
                    </div>
                    </div>

                    <div class="form-group mb-4">
                        <label class="label mb-2 flex justify-between">Brightness <span id="val-bright">100%</span></label>
                        <input type="range" id="filter-bright" min="0" max="200" value="100" class="w-full" oninput="applyFilters()">
                    </div>
                    
                    <div class="form-group mb-4">
                        <label class="label mb-2 flex justify-between">Contrast <span id="val-contrast">100%</span></label>
                        <input type="range" id="filter-contrast" min="0" max="200" value="100" class="w-full" oninput="applyFilters()">
                    </div>

                    <div class="form-group mb-4">
                        <label class="label mb-2 flex justify-between">Saturation <span id="val-saturate">100%</span></label>
                        <input type="range" id="filter-saturate" min="0" max="200" value="100" class="w-full" oninput="applyFilters()">
                    </div>
                    
                    <div class="form-group">
                        <label class="label">Download Format</label>
                        <select id="download-format" class="input w-full p-2 cursor-pointer">
                            <option value="image/png">PNG (Best - Preserves Transparency)</option>
                            <option value="image/jpeg">JPG (No Transparency - Uses applied BG color)</option>
                            <option value="image/webp">WEBP (Optimized & Transparent)</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Loader / Empty State UI -->
            <div class="card text-center mb-4" id="processing-view">
                <div id="processing-status" class="mt-2 text-gradient font-bold" style="font-size:1.2rem;">⏳ Processing with AI...</div>
            </div>

            <div class="flex justify-center gap-4 mt-4" id="action-buttons" style="display:none;">
                <button class="btn btn-primary" id="download-btn" onclick="downloadImage()">📥 Download Image</button>
                <button class="btn btn-secondary" onclick="resetApp()">↺ Process Another Image</button>
            </div>
        </div>
    </div>
    <div class="ad-container ad-banner" id="ad-bottom"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="BOTTOM_SLOT"></ins></div>
    <footer class="footer"><p>&copy; 2026 Free Background Remover. Client-side AI magic.</p></footer>
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.3/dist/browser.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="app.js"></script><script src="../../shared/theme-toggle.js"></script>
</body>
</html>
